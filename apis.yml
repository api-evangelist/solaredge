aid: solaredge
name: Solaredge
description: >-
  SolarEdge Technologies is a global provider of DC-optimized photovoltaic (PV)
  inverter systems — combining power optimizers, string inverters, batteries, EV
  chargers and a cloud monitoring platform for residential, commercial and utility
  solar installations. Its public developer surface is the SolarEdge Monitoring API,
  a read-only REST API over monitoringapi.solaredge.com that exposes site inventory,
  energy and power production, battery/storage telemetry, environmental benefits,
  equipment/inverter data, meters and sensors for the sites an account can access.
  Authentication is a single api_key query parameter issued in the SolarEdge
  monitoring platform; responses are JSON by default and errors use RFC 9457
  problem+json (verified live).
